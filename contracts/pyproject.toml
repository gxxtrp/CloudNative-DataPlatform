[project]
name = "data-contracts"
version = "0.1.0"
description = "Cloud-Native Data Contracts & Governance Linter"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "duckdb>=1.0.0",
    "pyiceberg[s3fs]>=0.7.1",
    "kafka-python-ng>=2.2.2",
    "prometheus-client>=0.20.0",
    "fastavro>=1.9.4",
    "jsonschema>=4.22.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "boto3>=1.34.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3-stubs[s3]>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.uv]
link-mode = "copy"
