# Master ArgoCD App-of-Apps Root Orchestrator (DEV Environment)
# Synchronizes autonomous AppProject and Application declarations for platform, apps, and observability.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform-root
  namespace: argocd
  labels:
    env: dev
    tier: control-plane
spec:
  project: default
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: argocd/dev/platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-apps-root
  namespace: argocd
  labels:
    env: dev
    tier: control-plane
spec:
  project: default
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: argocd/dev/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-observability-root
  namespace: argocd
  labels:
    env: dev
    tier: control-plane
spec:
  project: default
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: argocd/dev/observability
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
