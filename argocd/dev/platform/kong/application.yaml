apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform-kong
  namespace: argocd
  labels:
    env: dev
    tier: platform
    service: kong
spec:
  project: dev-platform-kong
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: k8s/platform/kong/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
