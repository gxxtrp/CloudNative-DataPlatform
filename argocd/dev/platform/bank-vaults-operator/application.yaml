apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-bank-vaults-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    env: dev
    tier: platform
    service: bank-vaults-operator
spec:
  project: default
  source:
    repoURL: https://charts.bank-vaults.dev
    chart: vault-operator
    targetRevision: 1.20.0
    helm:
      values: |
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        # Watch all namespaces for Vault CRs
        watchNamespace: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
