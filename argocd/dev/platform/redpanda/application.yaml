apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform-redpanda
  namespace: argocd
  labels:
    env: dev
    tier: platform
    service: redpanda
spec:
  project: dev-platform-redpanda
  source:
    repoURL: https://github.com/example/data-platform.git
    targetRevision: HEAD
    path: k8s/platform/redpanda/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
