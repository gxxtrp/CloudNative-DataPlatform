apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform-vault
  namespace: argocd
  annotations:
    # Sync after bank-vaults operator (wave -1) so Vault CRD is registered
    argocd.argoproj.io/sync-wave: "0"
  labels:
    env: dev
    tier: security
    service: vault
spec:
  project: dev-platform-vault
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: k8s/security/vault/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
