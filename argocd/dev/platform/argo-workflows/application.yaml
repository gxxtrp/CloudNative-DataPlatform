apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform-argo-workflows
  namespace: argocd
  labels:
    env: dev
    tier: platform
    service: argo-workflows
spec:
  project: dev-platform-argo-workflows
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: k8s/platform/argo-workflows/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
