apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-app-settlement-engine
  namespace: argocd
  labels:
    env: dev
    tier: workload
    app: settlement-engine
spec:
  project: dev-app-settlement-engine
  source:
    repoURL: https://github.com/example/data-platform.git
    targetRevision: HEAD
    path: k8s/apps/settlement-engine/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
