# DEFERRED: Jaeger distributed tracing deferred on single-node k3s (memory constraints).
# Re-enable automated sync when moving to EKS or adding RAM.
# Memory saved: ~128 MiB
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-observability-jaeger
  namespace: argocd
  labels:
    env: dev
    tier: observability
    service: jaeger
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: dev-observability-jaeger
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: k8s/observability/jaeger/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    # automated sync disabled - component deferred
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
