apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-observability-jaeger
  namespace: argocd
  labels:
    env: dev
    tier: observability
    service: jaeger
spec:
  project: dev-observability-jaeger
  source:
    repoURL: https://github.com/example/data-platform.git
    targetRevision: HEAD
    path: k8s/observability/jaeger/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
