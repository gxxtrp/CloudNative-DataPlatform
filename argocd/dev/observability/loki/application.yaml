# DEFERRED: Loki + Promtail deferred on single-node k3s (memory constraints).
# Re-enable automated sync when moving to EKS or adding RAM.
# Memory saved: ~160 MiB
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-observability-loki
  namespace: argocd
  labels:
    env: dev
    tier: observability
    service: loki
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: dev-observability-loki
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: k8s/observability/loki/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    # automated sync disabled - component deferred
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
