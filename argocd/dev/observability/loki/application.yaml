apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-observability-loki
  namespace: argocd
  labels:
    env: dev
    tier: observability
    service: loki
spec:
  project: dev-observability-loki
  source:
    repoURL: https://github.com/gxxtrp/CloudNative-DataPlatform.git
    targetRevision: HEAD
    path: k8s/observability/loki/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
