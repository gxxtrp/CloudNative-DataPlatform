apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-platform-network-policies
  namespace: argocd
  labels:
    env: prod
    tier: platform
    service: network-policies
spec:
  project: prod-platform-network-policies
  source:
    repoURL: https://github.com/example/data-platform.git
    targetRevision: HEAD
    path: k8s/platform/network-policies/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
