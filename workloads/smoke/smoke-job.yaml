apiVersion: batch/v1
kind: Job
metadata:
  name: m0-smoke-workload
  namespace: platform
  labels:
    app: m0-smoke
    environment: dev
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: m0-smoke
    spec:
      serviceAccountName: platform-workload
      restartPolicy: Never
      nodeSelector:
        pool: compute
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "compute"
        effect: "NoSchedule"
      containers:
      - name: smoke-test
        image: asia-southeast1-docker.pkg.dev/sbx-workload-poc-508107/platform-dev-images/smoke:v1
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          echo '{"severity":"INFO","component":"m0-smoke","message":"Starting Milestone 0 smoke workload on compute node pool"}'
          
          ACTIVE_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format="value(account)" 2>/dev/null || echo "workload-identity-active")
          echo "{\"severity\":\"INFO\",\"component\":\"m0-smoke\",\"message\":\"Active GCP identity: ${ACTIVE_ACCOUNT}\"}"
          
          PAYLOAD="{\"status\":\"SUCCESS\",\"milestone\":\"M0\",\"test\":\"workload-identity-gcs\",\"timestamp\":\"$(date -u +%FT%TZ)\",\"node_pool\":\"compute\"}"
          echo "${PAYLOAD}" > /tmp/verification.json
          
          echo '{"severity":"INFO","component":"m0-smoke","message":"Uploading verification payload to lake bucket using gcloud storage"}'
          gcloud storage cp /tmp/verification.json gs://sbx-workload-poc-508107-lake-dev/smoke/verification.json
          
          echo '{"severity":"INFO","component":"m0-smoke","message":"Reading back verification payload from lake bucket"}'
          DOWNLOADED=$(gcloud storage cat gs://sbx-workload-poc-508107-lake-dev/smoke/verification.json)
          
          echo "{\"severity\":\"INFO\",\"component\":\"m0-smoke\",\"message\":\"Verification payload confirmed\",\"payload\":${DOWNLOADED}}"
          echo '{"severity":"INFO","component":"m0-smoke","message":"Milestone 0 acceptance smoke workload PASSED successfully"}'
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
