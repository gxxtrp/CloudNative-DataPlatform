apiVersion: batch/v1
kind: Job
metadata:
  name: m0-smoke-denied-workload
  namespace: processing
  labels:
    app: m0-smoke-denied
    environment: dev
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: m0-smoke-denied
    spec:
      serviceAccountName: processing-workload
      restartPolicy: Never
      nodeSelector:
        pool: compute
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "compute"
        effect: "NoSchedule"
      containers:
      - name: smoke-denied-test
        image: asia-southeast1-docker.pkg.dev/sbx-workload-poc-508107/platform-dev-images/smoke:v1
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          echo '{"severity":"INFO","component":"m0-smoke-denied","message":"Starting negative authorization test with unprivileged identity"}'
          
          # Attempt to retrieve token - will fail or return no workload identity mapping
          TOKEN_RESP=$(curl -s -w "\n%{http_code}" -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" || true)
          HTTP_CODE=$(echo "${TOKEN_RESP}" | tail -n1)
          TOKEN_BODY=$(echo "${TOKEN_RESP}" | sed '$d')
          
          echo "{\"severity\":\"INFO\",\"component\":\"m0-smoke-denied\",\"message\":\"Metadata server response code: ${HTTP_CODE}\"}"
          
          TOKEN=$(echo "${TOKEN_BODY}" | jq -r .access_token 2>/dev/null || echo "")
          
          # Attempt unauthorized write to lake bucket
          UPLOAD_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"illegal":"write"}' \
            "https://storage.googleapis.com/upload/storage/v1/b/sbx-workload-poc-508107-lake-dev/o?uploadType=media&name=smoke/denied.json" || true)
          
          UPLOAD_CODE=$(echo "${UPLOAD_RESP}" | tail -n1)
          UPLOAD_BODY=$(echo "${UPLOAD_RESP}" | sed '$d')
          
          echo "{\"severity\":\"INFO\",\"component\":\"m0-smoke-denied\",\"message\":\"GCS upload response code: ${UPLOAD_CODE}\",\"response\":\"${UPLOAD_BODY}\"}"
          
          if [[ "${UPLOAD_CODE}" == "401" || "${UPLOAD_CODE}" == "403" ]]; then
            echo '{"severity":"INFO","component":"m0-smoke-denied","message":"Security boundary verified: Unauthorized write was correctly DENIED with 401/403"}'
            exit 0
          else
            echo "{\"severity\":\"ERROR\",\"component\":\"m0-smoke-denied\",\"message\":\"Security violation: Unauthorized write succeeded or returned unexpected code: ${UPLOAD_CODE}\"}"
            exit 1
          fi
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
