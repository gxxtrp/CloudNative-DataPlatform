apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-smoke
  namespace: processing
  labels:
    app.kubernetes.io/name: spark-smoke
    app.kubernetes.io/component: batch-job
spec:
  type: Scala
  mode: cluster
  image: apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.5.1.jar
  arguments:
  - "1000"
  sparkVersion: "3.5.1"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 10
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "1024m"
    labels:
      version: 3.5.1
    serviceAccount: spark-operator-spark
    nodeSelector:
      pool: compute
    tolerations:
    - key: "workload"
      operator: "Equal"
      value: "compute"
      effect: "NoSchedule"
  executor:
    cores: 1
    instances: 2
    memory: "1024m"
    labels:
      version: 3.5.1
    nodeSelector:
      pool: compute
    tolerations:
    - key: "workload"
      operator: "Equal"
      value: "compute"
      effect: "NoSchedule"
  dynamicAllocation:
    enabled: true
    initialExecutors: 1
    minExecutors: 1
    maxExecutors: 4
