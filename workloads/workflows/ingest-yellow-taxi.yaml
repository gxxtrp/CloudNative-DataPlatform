apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ingest-nyc-yellow-taxi-
  namespace: ingestion
  labels:
    tier: bronze
    dataset: nyc-taxi
    pipeline: batch-ingestion
spec:
  entrypoint: ingest-pipeline
  serviceAccountName: ingestion-runner
  nodeSelector:
    pool: compute
  tolerations:
  - key: "workload"
    operator: "Equal"
    value: "compute"
    effect: "NoSchedule"
  arguments:
    parameters:
    - name: year
      value: "2024"
    - name: month
      value: "01"

  templates:
  - name: ingest-pipeline
    inputs:
      parameters:
      - name: year
      - name: month
    steps:
    - - name: fetch-and-upload-bronze
        template: fetch-and-upload
        arguments:
          parameters:
          - name: year
            value: "{{inputs.parameters.year}}"
          - name: month
            value: "{{inputs.parameters.month}}"

  - name: fetch-and-upload
    inputs:
      parameters:
      - name: year
      - name: month
    container:
      image: google/cloud-sdk:slim
      command: [sh, -c]
      args:
      - |
        set -euo pipefail
        YEAR="{{inputs.parameters.year}}"
        MONTH="{{inputs.parameters.month}}"
        FILE_NAME="yellow_tripdata_${YEAR}-${MONTH}.parquet"
        SOURCE_URL="https://d37ci6vzurychx.cloudfront.net/trip-data/${FILE_NAME}"
        DEST_GCS="gs://sbx-workload-poc-508107-lake-bronze-dev/nyc-taxi/yellow/year=${YEAR}/month=${MONTH}/${FILE_NAME}"
        META_GCS="gs://sbx-workload-poc-508107-lake-bronze-dev/nyc-taxi/yellow/year=${YEAR}/month=${MONTH}/${FILE_NAME}.manifest.json"
        
        echo "========================================================="
        echo "Starting Bronze Ingestion for NYC Yellow Taxi: ${YEAR}-${MONTH}"
        echo "Source: ${SOURCE_URL}"
        echo "Destination: ${DEST_GCS}"
        echo "========================================================="
        
        WORKDIR="/tmp/ingest"
        mkdir -p "${WORKDIR}"
        LOCAL_FILE="${WORKDIR}/${FILE_NAME}"
        
        echo "[1/4] Streaming source parquet from TLC CDN..."
        curl -fSL "${SOURCE_URL}" -o "${LOCAL_FILE}"
        
        FILE_SIZE=$(stat -c%s "${LOCAL_FILE}")
        FILE_HASH=$(sha256sum "${LOCAL_FILE}" | cut -d ' ' -f 1)
        echo "Downloaded ${FILE_SIZE} bytes. SHA256: ${FILE_HASH}"
        
        echo "[2/4] Uploading raw asset to Bronze Lake..."
        gcloud storage cp "${LOCAL_FILE}" "${DEST_GCS}"
        
        echo "[3/4] Generating Ingestion Manifest..."
        TIMESTAMP=$(date -u +%FT%TZ)
        cat <<EOF > /tmp/manifest.json
        {
          "dataset": "nyc-yellow-taxi",
          "year": "${YEAR}",
          "month": "${MONTH}",
          "source_url": "${SOURCE_URL}",
          "destination_gcs": "${DEST_GCS}",
          "byte_size": ${FILE_SIZE},
          "sha256_checksum": "${FILE_HASH}",
          "ingestion_timestamp": "${TIMESTAMP}",
          "orchestrator": "argo-workflows",
          "tier": "bronze"
        }
        EOF
        
        echo "[4/4] Writing Manifest to Bronze Lake and operational artifacts..."
        gcloud storage cp /tmp/manifest.json "${META_GCS}"
        echo "Ingestion completed successfully."
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
    outputs:
      artifacts:
      - name: ingestion-manifest
        path: /tmp/manifest.json
