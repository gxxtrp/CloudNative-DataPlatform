apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: catalog
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polaris
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polaris
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: polaris
      nodeSelector:
        pool: core
      containers:
      - name: polaris
        image: apache/polaris:1.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8181
          name: http-api
        - containerPort: 8182
          name: management
        env:
        - name: POLARIS_PERSISTENCE_TYPE
          value: "in-memory"
        - name: QUARKUS_DATASOURCE_DB_KIND
          value: "postgresql"
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: "jdbc:postgresql://postgres.platform-db.svc.cluster.local:5432/polaris"
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: polaris-secrets
              key: DB_USERNAME
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: polaris-secrets
              key: DB_PASSWORD
        - name: QUARKUS_HTTP_PORT
          value: "8181"
        - name: QUARKUS_HTTP_HOST
          value: "0.0.0.0"
        - name: POLARIS_REALM
          value: "POLARIS"
        - name: POLARIS_REALM_CONTEXT_REALMS
          value: "POLARIS"
        - name: POLARIS_REALM_CONTEXT_REQUIRE_HEADER
          value: "false"
        - name: POLARIS_BOOTSTRAP_CREDENTIALS
          value: "POLARIS,polaris-root-client,polaris-root-secret"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8182
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8182
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
