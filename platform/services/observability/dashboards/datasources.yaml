apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://gmp-operator.gmp-system.svc.cluster.local:8443
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
