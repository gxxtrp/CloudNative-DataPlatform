apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: 'platform-dashboards'
      orgId: 1
      folder: 'Platform'
      type: file
      disableDeletion: true
      editable: true
      options:
        path: /var/lib/grafana/dashboards
