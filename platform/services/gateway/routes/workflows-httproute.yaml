apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workflows-route
  namespace: argo
spec:
  parentRefs:
  - name: platform-gateway
    namespace: kong
    sectionName: http
  - name: platform-gateway
    namespace: kong
    sectionName: https
  hostnames:
  - "workflows.34.87.177.6.nip.io"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argo-server
      port: 2746
