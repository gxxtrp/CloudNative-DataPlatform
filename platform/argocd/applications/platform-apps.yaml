  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/CloudNative-DataPlatform.git
    targetRevision: main
    path: platform/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
