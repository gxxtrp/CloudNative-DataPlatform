# App-of-Apps for Platform Services
# ArgoCD manages all platform components
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/CloudNative-DataPlatform.git
    targetRevision: main
    path: platform/argocd/applications/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Individual platform applications
apiVersion: argoproj.io/v1alpha1
kind: Application
