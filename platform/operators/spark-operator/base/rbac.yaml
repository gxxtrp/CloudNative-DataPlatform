# Additional RBAC for Spark jobs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: batch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: batch
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: batch
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: batch
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
