apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: platform
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 16Gi
    limits.cpu: "8"
    limits.memory: 32Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-limits
  namespace: platform
spec:
  limits:
  - default:
      cpu: 1000m
      memory: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: processing
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-limits
  namespace: processing
spec:
  limits:
  - default:
      cpu: 2000m
      memory: 4Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: ingestion
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 16Gi
    limits.cpu: "8"
    limits.memory: 32Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-limits
