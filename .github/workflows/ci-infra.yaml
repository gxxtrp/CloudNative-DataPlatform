name: "CI: Infrastructure as Code"

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-infra.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-infra.yaml'

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Local Self-Manage Environment
        run: |
          cd infra/terraform/envs/self_manage
          terraform init -backend=false
          terraform validate

      - name: Validate AWS Free Tier Environment
        run: |
          cd infra/terraform/envs/free_tier_aws
          terraform init -backend=false
          terraform validate
