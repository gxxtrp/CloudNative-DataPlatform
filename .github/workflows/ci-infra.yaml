name: "CI: Infrastructure as Code"

on:
  push:
    branches: [main]
    paths:
      - 'dataplatform/terraform/**'
      - 'workload/terraform/**'
      - '.github/workflows/ci-infra.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'dataplatform/terraform/**'
      - 'workload/terraform/**'
      - '.github/workflows/ci-infra.yaml'

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -recursive dataplatform/terraform
          terraform fmt -check -recursive workload/terraform

      - name: Validate every Terraform root without remote state
        run: make terraform-validate
