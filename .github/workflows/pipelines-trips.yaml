# Trips Domain Pipeline CI/CD
name: Pipelines - Trips

on:
  push:
    branches: [main]
    paths:
      - 'pipelines/domains/trips/**'
  pull_request:
    branches: [main]
    paths:
      - 'pipelines/domains/trips/**'

jobs:
  test-spark:
    name: Test Spark Jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: pipelines/domains/trips/spark
        run: |
          pip install -e ".[dev]"

      - name: Run Tests
        working-directory: pipelines/domains/trips/spark
        run: pytest tests/ -v

      - name: Lint
        working-directory: pipelines/domains/trips/spark
        run: |
          pip install ruff
          ruff check src/

  test-flink:
    name: Test Flink Jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven
        working-directory: pipelines/domains/trips/flink
        run: mvn clean verify

  build-spark-image:
    name: Build Spark Image
    runs-on: ubuntu-latest
    needs: test-spark
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push
        working-directory: pipelines/domains/trips/spark
        run: |
          docker build -t us-central1-docker.pkg.dev/dataplatform-dev/data-platform/trips-spark:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/dataplatform-dev/data-platform/trips-spark:${{ github.sha }}

  build-flink-image:
    name: Build Flink Image
    runs-on: ubuntu-latest
    needs: test-flink
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push
        working-directory: pipelines/domains/trips/flink
        run: |
          docker build -t us-central1-docker.pkg.dev/dataplatform-dev/data-platform/trips-flink:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/dataplatform-dev/data-platform/trips-flink:${{ github.sha }}

  upload-artifacts:
    name: Upload Spark Scripts
    runs-on: ubuntu-latest
    needs: test-spark
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Upload to GCS
        run: |
          gsutil cp pipelines/domains/trips/spark/src/*.py \
            gs://dataplatform-dev-lake/artifacts/trips/
