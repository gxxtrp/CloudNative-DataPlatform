name: "Plan: GCP Terraform"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Terraform root to plan"
        required: true
        type: choice
        options:
          - dataplatform-foundation
          - managed-data
          - managed-kafka
          - workload-foundation
          - workload-network
          - workload-cloud-sql
          - artifact-registry

concurrency:
  group: gcp-terraform-plan-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_dataplatform_project_id: ${{ vars.GCP_DATAPLATFORM_PROJECT_ID }}
      TF_VAR_dataplatform_project_number: ${{ vars.GCP_DATAPLATFORM_PROJECT_NUMBER }}
      TF_VAR_workload_project_id: ${{ vars.GCP_WORKLOAD_PROJECT_ID }}
      TF_VAR_workload_project_number: ${{ vars.GCP_WORKLOAD_PROJECT_NUMBER }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_platform_owner_email: ${{ vars.GCP_PLATFORM_OWNER_EMAIL }}
      TF_VAR_terraform_operator_email: ${{ vars.GCP_PLATFORM_OWNER_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Terraform root
        run: |
          case "${{ inputs.target }}" in
            dataplatform-foundation) echo "TF_ROOT=dataplatform/terraform/foundation" >> "$GITHUB_ENV" ;;
            managed-data) echo "TF_ROOT=dataplatform/terraform/managed-data" >> "$GITHUB_ENV" ;;
            managed-kafka) echo "TF_ROOT=dataplatform/terraform/managed-kafka" >> "$GITHUB_ENV" ;;
            workload-foundation) echo "TF_ROOT=workload/terraform/foundation" >> "$GITHUB_ENV" ;;
            workload-network) echo "TF_ROOT=workload/terraform/network" >> "$GITHUB_ENV" ;;
            workload-cloud-sql) echo "TF_ROOT=workload/terraform/cloud-sql" >> "$GITHUB_ENV" ;;
            artifact-registry) echo "TF_ROOT=workload/terraform/artifact-registry" >> "$GITHUB_ENV" ;;
          esac

      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ (startsWith(inputs.target, 'workload-') || inputs.target == 'artifact-registry') && vars.GCP_WORKLOAD_WIF_PROVIDER || vars.GCP_DATAPLATFORM_WIF_PROVIDER }}
          service_account: ${{ (startsWith(inputs.target, 'workload-') || inputs.target == 'artifact-registry') && vars.GCP_WORKLOAD_TERRAFORM_PLAN_SA || vars.GCP_DATAPLATFORM_TERRAFORM_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Initialize remote state
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Create plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -input=false -lock-timeout=5m
