name: CI - Data Workloads

on:
  push:
    branches: [ main ]
    paths:
      - 'workloads/**'
      - '.github/workflows/ci-workloads.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'workloads/**'
      - '.github/workflows/ci-workloads.yaml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sbx-workload-poc-508107
  PROJECT_NUMBER: "589151052995"
  REGION: asia-southeast1
  REPO: platform-dev-images

jobs:
  test-public-batch:
    name: Test NYC Taxi Public Batch Ingest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd workloads/ingestion/public-batch
          pip install --upgrade pip
          pip install .

      - name: Run Unit Tests
        run: |
          cd workloads/ingestion/public-batch
          python -m unittest discover -s tests -v

  build-push-public-batch:
    name: Build & Publish Public Batch Ingest Image
    needs: test-public-batch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: workloads/ingestion/public-batch
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/public-batch-ingest:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/public-batch-ingest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
