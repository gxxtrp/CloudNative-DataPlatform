name: "CD: Build & Push Container Images"

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'Microservice to build (all or specific app)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - order-service
          - rider-service
          - stream-ingestor
          - settlement-engine
          - traffic-generator

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Microservice Path Detection
  # ----------------------------------------------------------------------------
  detect-apps:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Changed Apps
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-service:
              - 'apps/order-service/**'
            rider-service:
              - 'apps/rider-service/**'
            stream-ingestor:
              - 'apps/stream-ingestor/**'
            settlement-engine:
              - 'apps/settlement-engine/**'
            traffic-generator:
              - 'apps/traffic-generator/**'

      - name: Determine Target Apps Matrix
        id: set-matrix
        env:
          CHANGED_APPS: ${{ steps.filter.outputs.changes }}
          DISPATCH_APP: ${{ inputs.app }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$DISPATCH_APP" ] || [ "$DISPATCH_APP" = "all" ]; then
              echo 'apps=["order-service", "rider-service", "stream-ingestor", "settlement-engine", "traffic-generator"]' >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "apps=[\"$DISPATCH_APP\"]" >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$CHANGED_APPS" != "[]" ] && [ -n "$CHANGED_APPS" ]; then
              echo "apps=$CHANGED_APPS" >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo 'apps=[]' >> "$GITHUB_OUTPUT"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ----------------------------------------------------------------------------
  # 2. Multi-Stage Distroless Build & Push to ghcr.io
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    needs: detect-apps
    if: ${{ needs.detect-apps.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-apps.outputs.apps) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize Lowercase Repository Owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Distroless Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
