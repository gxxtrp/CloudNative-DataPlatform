name: Build App

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Microservice Path Detection
  # ----------------------------------------------------------------------------
  detect-apps:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      order-service: ${{ steps.filter.outputs.order-service }}
      rider-service: ${{ steps.filter.outputs.rider-service }}
      stream-ingestor: ${{ steps.filter.outputs.stream-ingestor }}
      settlement-engine: ${{ steps.filter.outputs.settlement-engine }}
      traffic-generator: ${{ steps.filter.outputs.traffic-generator }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Changed Apps
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-service:
              - 'apps/order-service/**'
            rider-service:
              - 'apps/rider-service/**'
            stream-ingestor:
              - 'apps/stream-ingestor/**'
            settlement-engine:
              - 'apps/settlement-engine/**'
            traffic-generator:
              - 'apps/traffic-generator/**'

  # ----------------------------------------------------------------------------
  # 2. Multi-Stage Distroless Build & Push to ghcr.io
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    needs: detect-apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - order-service
          - rider-service
          - stream-ingestor
          - settlement-engine
          - traffic-generator
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-apps.outputs[matrix.app] == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize Lowercase Repository Owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Distroless Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
