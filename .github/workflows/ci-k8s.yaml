name: "CI: Kubernetes & GitOps Manifests"

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'argocd/**'
      - '.github/workflows/ci-k8s.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'argocd/**'
      - '.github/workflows/ci-k8s.yaml'

concurrency:
  group: ci-k8s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest-validate:
    name: Validate K8s & ArgoCD Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Parse & Validate All 192 Manifests
        run: |
          python -c "
          import glob, yaml, sys
          files = glob.glob('k8s/**/*.yaml', recursive=True) + glob.glob('k8s/**/*.yml', recursive=True) + glob.glob('argocd/**/*.yaml', recursive=True) + glob.glob('argocd/**/*.yml', recursive=True)
          errors = 0
          doc_count = 0
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fh:
                      docs = list(yaml.safe_load_all(fh))
                      doc_count += len(docs)
              except Exception as e:
                  print(f'ERROR parsing {f}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              print(f'FAILED: {errors} files had YAML parse errors.', file=sys.stderr)
              sys.exit(1)
          print(f'PASSED: Successfully validated {len(files)} YAML files ({doc_count} documents).')
          "

      - name: Validate Kustomize Build Overlays
        run: |
          echo "==> Validating Kustomize overlays..."
          for overlay in k8s/platform/*/overlays/dev k8s/platform/*/overlays/prod \
                         k8s/observability/*/overlays/dev k8s/observability/*/overlays/prod \
                         k8s/apps/*/overlays/dev k8s/apps/*/overlays/prod; do
            if [ -d "$overlay" ]; then
              echo "Validating $overlay"
              kubectl kustomize "$overlay" > /dev/null
            fi
          done
          echo "All Kustomize overlays build successfully."
