[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trips-spark"
version = "0.1.0"
description = "Spark jobs for Trips domain"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "pyspark>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "black",
    "chispa",  # Spark DataFrame testing
]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
