apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-secretstore
  labels:
    app.kubernetes.io/name: vault-cluster-secretstore
    app.kubernetes.io/component: security-secrets
    app.kubernetes.io/part-of: cloudnative-dataplatform
spec:
  provider:
    vault:
      server: "http://vault.vault-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "platform-workloads"
          serviceAccountRef:
            name: "vault"
            namespace: "vault-system"
