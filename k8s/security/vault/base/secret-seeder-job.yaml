apiVersion: batch/v1
kind: Job
metadata:
  name: vault-secret-seeder
  namespace: vault-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: vault-secret-seeder
    app.kubernetes.io/component: security-secrets
    app.kubernetes.io/part-of: cloudnative-dataplatform
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: vault-secret-seeder
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vault
      containers:
        - name: seeder
          image: hashicorp/vault:1.16.1
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault-system.svc.cluster.local:8200"
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "Starting automated Vault secret seeder..."
              APISERVER="https://kubernetes.default.svc"
              SERVICEACCOUNT="/var/run/secrets/kubernetes.io/serviceaccount"
              K8S_TOKEN=$(cat ${SERVICEACCOUNT}/token)

              echo "Waiting for Bank-Vaults to unseal Vault and publish token..."
              until [ -n "${VAULT_TOKEN:-}" ]; do
                SECRET_JSON=$(wget --no-check-certificate --header="Authorization: Bearer ${K8S_TOKEN}" \
                  -qO- "${APISERVER}/api/v1/namespaces/vault-system/secrets/vault-unseal-keys" 2>/dev/null || true)
                if [ -n "${SECRET_JSON}" ]; then
                  B64_TOKEN=$(echo "${SECRET_JSON}" | grep -o '"vault-root":"[^"]*"' | cut -d'"' -f4 || true)
                  if [ -n "${B64_TOKEN}" ]; then
                    VAULT_TOKEN=$(echo "${B64_TOKEN}" | base64 -d)
                    export VAULT_TOKEN
                  fi
                fi
                if [ -z "${VAULT_TOKEN:-}" ]; then
                  echo "Waiting for vault-unseal-keys secret..."
                  sleep 3
                fi
              done

              echo "Waiting for Vault API to become healthy at ${VAULT_ADDR}..."
              until vault status >/dev/null 2>&1; do
                sleep 2
              done
              echo "Vault is ready and unsealed."

              echo "Seeding platform infrastructure secrets..."
              vault kv put secret/platform/minio \
                access-key="minioadmin" \
                secret-key="minioadmin" \
                endpoint="http://minio.platform.svc.cluster.local:9000"

              vault kv put secret/platform/postgres \
                password="postgres-super-secure-password"

              vault kv put secret/observability/grafana \
                admin-user="admin" \
                admin-password="grafana-admin-password"

              echo "Seeding application workload secrets..."
              vault kv put secret/apps/order-service \
                PORT="8080" \
                REDPANDA_BROKERS="redpanda.platform.svc.cluster.local:9092" \
                ORDERS_TOPIC="orders.lifecycle"

              vault kv put secret/apps/rider-service \
                PORT="8081" \
                REDPANDA_BROKERS="redpanda.platform.svc.cluster.local:9092" \
                RIDERS_TOPIC="riders.telemetry"

              vault kv put secret/apps/stream-ingestor \
                PORT="8082" \
                REDPANDA_BROKERS="redpanda.platform.svc.cluster.local:9092" \
                MINIO_ENDPOINT="http://minio.platform.svc.cluster.local:9000" \
                BRONZE_BUCKET="lakehouse-bronze"

              vault kv put secret/apps/traffic-generator \
                KONG_GATEWAY_URL="http://kong-proxy.platform.svc.cluster.local:8000"

              echo "All platform and workload secrets successfully seeded into Vault KV v2!"
