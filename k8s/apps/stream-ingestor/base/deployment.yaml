apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-ingestor
  namespace: apps
  labels:
    app: stream-ingestor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-ingestor
  template:
    metadata:
      labels:
        app: stream-ingestor
    spec:
      containers:
        - name: stream-ingestor
          image: platform/stream-ingestor:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: stream-ingestor-env
                  key: PORT
            - name: REDPANDA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: stream-ingestor-env
                  key: REDPANDA_BROKERS
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: stream-ingestor-env
                  key: MINIO_ENDPOINT
            - name: BRONZE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: stream-ingestor-env
                  key: BRONZE_BUCKET
          ports:
            - name: http
              containerPort: 8082
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
