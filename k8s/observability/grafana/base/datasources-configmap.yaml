apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: true

      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager.observability.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
        editable: true

      # DEFERRED: Loki and Jaeger are not deployed on single-node k3s (memory constraints).
      # Uncomment when moving to EKS or when RAM is added.
      # - name: Loki
      #   type: loki
      #   access: proxy
      #   url: http://loki.observability.svc.cluster.local:3100
      #   jsonData:
      #     maxLines: 1000
      #   editable: true
      #
      # - name: Jaeger
      #   type: jaeger
      #   access: proxy
      #   url: http://jaeger.observability.svc.cluster.local:16686
      #   editable: true
