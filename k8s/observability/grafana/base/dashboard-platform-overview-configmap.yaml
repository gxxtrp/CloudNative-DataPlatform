apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-overview
  namespace: observability
data:
  platform-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": 1,
      "links": [
        {
          "title": "Jaeger Tracing UI",
          "url": "http://localhost:31686",
          "targetBlank": true
        }
      ],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "title": "Ingress Request Rate",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "rate(kong_http_requests_total[1m])", "legendFormat": "RPS" }]
        },
        {
          "id": 2,
          "title": "Valid Events Ingested",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "expr": "valid_events_total", "legendFormat": "Valid" }]
        },
        {
          "id": 3,
          "title": "Dead Letter Queue (DLQ) Errors",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "dlq_events_total", "legendFormat": "DLQ" }]
        },
        {
          "id": 4,
          "title": "Transactional Outbox Pending",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [{ "expr": "outbox_pending_events", "legendFormat": "Pending" }]
        },
        {
          "id": 5,
          "title": "Orders Created Total",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 6 },
          "targets": [{ "expr": "orders_created_total", "legendFormat": "Orders" }]
        },
        {
          "id": 6,
          "title": "Rider GPS Pings Total",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 6 },
          "targets": [{ "expr": "rider_telemetry_pings_total", "legendFormat": "Pings" }]
        },
        {
          "id": 7,
          "title": "Platform Logs (Loki Live Stream)",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "loki", "uid": "Loki" },
          "targets": [{ "expr": "{job=\"kubernetes-pods\"}", "legendFormat": "{{pod}}" }]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["data-platform", "sre"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "Data Platform Overview"
    }
