apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
    tier: observability
spec:
  type: NodePort
  ports:
    - name: query-ui
      port: 16686
      targetPort: 16686
      nodePort: 31686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: admin-metrics
      port: 14269
      targetPort: 14269
  selector:
    app: jaeger
