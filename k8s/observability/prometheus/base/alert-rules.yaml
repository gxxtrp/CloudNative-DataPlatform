apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: observability
data:
  platform-slo-rules.yaml: |
    groups:
      - name: platform-slo-alerts
        rules:
          - alert: HighConsumerLag
            expr: redpanda_consumer_lag_records{group="stream-ingestor-group"} > 500
            for: 3m
            labels:
              severity: warning
              tier: streaming
            annotations:
              summary: "Stream Ingestor consumer group lag exceeded 500 records"
              description: "Consumer lag on Redpanda has been > 500 records for 3 minutes."

          - alert: HighDLQRate
            expr: rate(dlq_events_total[5m]) / (rate(valid_events_total[5m]) + rate(dlq_events_total[5m])) > 0.005
            for: 2m
            labels:
              severity: critical
              tier: data-quality
            annotations:
              summary: "DLQ error rate exceeded 0.5% SLO threshold"
              description: "High volume of schema validation failures or poison pill events routed to DLQ."

          - alert: StreamIngestorDown
            expr: up{job="stream-ingestor"} == 0
            for: 1m
            labels:
              severity: critical
              tier: ingestion
            annotations:
              summary: "Stream Ingestor worker instance is unreachable"
              description: "Stream Ingestor has been down for over 1 minute."

          - alert: OrderServiceDown
            expr: up{job="order-service"} == 0
            for: 1m
            labels:
              severity: critical
              tier: domain-apps
            annotations:
              summary: "Order Service instance is unreachable"
              description: "Order Service has failed health checks for over 1 minute."
