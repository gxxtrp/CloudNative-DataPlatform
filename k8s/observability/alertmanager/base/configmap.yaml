apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'tier', 'severity']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'sre-default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'sre-critical-receiver'
          continue: true

    receivers:
      - name: 'sre-default-receiver'
        webhook_configs:
          - url: 'http://127.0.0.1:5001/alerts'
            send_resolved: true

      - name: 'sre-critical-receiver'
        webhook_configs:
          - url: 'http://127.0.0.1:5001/critical-alerts'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'tier']
