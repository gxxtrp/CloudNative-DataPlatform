apiVersion: batch/v1
kind: CronJob
metadata:
  name: lakehouse-compactor
  namespace: platform
  labels:
    app.kubernetes.io/name: lakehouse-compactor
    app.kubernetes.io/part-of: cloudnative-dataplatform
    app.kubernetes.io/component: storage-compaction
spec:
  schedule: "0 * * * *" # Hourly execution
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: lakehouse-compactor
        spec:
          restartPolicy: OnFailure
          containers:
            - name: compactor
              image: platform/compactor:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - tools.compactor
              args:
                - "--source"
                - "s3://lakehouse-bronze/orders/**/*.parquet"
                - "--output"
                - "s3://lakehouse-silver/orders/compacted.parquet"
                - "--target-size-mb"
                - "64"
                - "--compression"
                - "snappy"
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: s3-endpoint
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: secret-key
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
