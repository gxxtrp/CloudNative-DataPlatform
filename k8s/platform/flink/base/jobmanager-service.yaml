apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: platform
  labels:
    app: flink
    component: jobmanager
spec:
  type: NodePort
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
    - name: webui
      port: 8081
      targetPort: 8081
      nodePort: 38081
  selector:
    app: flink
    component: jobmanager
