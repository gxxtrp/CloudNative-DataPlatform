apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-executor-sa
  namespace: platform
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: spark-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-executor-role
  namespace: platform
  labels:
    app.kubernetes.io/name: spark
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-executor-rb
  namespace: platform
  labels:
    app.kubernetes.io/name: spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-executor-role
subjects:
  - kind: ServiceAccount
    name: spark-executor-sa
    namespace: platform
