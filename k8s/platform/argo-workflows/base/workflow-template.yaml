apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: daily-settlement-pipeline
  namespace: platform
spec:
  entrypoint: settlement-dag
  serviceAccountName: default
  arguments:
    parameters:
      - name: settlement-date
        value: "2026-09-06"
  templates:
    - name: settlement-dag
      dag:
        tasks:
          - name: run-settlement-engine
            template: run-settlement
            arguments:
              parameters:
                - name: settlement-date
                  value: "{{workflow.parameters.settlement-date}}"

    - name: run-settlement
      inputs:
        parameters:
          - name: settlement-date
      container:
        image: platform/settlement-engine:latest
        imagePullPolicy: IfNotPresent
        args: ["--date", "{{inputs.parameters.settlement-date}}"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
