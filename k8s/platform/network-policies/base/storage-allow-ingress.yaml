apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storage-ingress
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
