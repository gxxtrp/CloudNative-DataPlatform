apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: platform
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.3
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=768M
            - --reserve-memory=0M
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.platform.svc.cluster.local:9092
            - --pandaproxy-addr=0.0.0.0:8082
            - --advertise-pandaproxy-addr=redpanda.platform.svc.cluster.local:8082
            - --schema-registry-addr=0.0.0.0:8081
            - --mode=dev-container
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
            - name: schema-reg
              containerPort: 8081
            - name: proxy
              containerPort: 8082
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: redpanda-data-pvc
