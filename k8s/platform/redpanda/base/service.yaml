apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: platform
  labels:
    app: redpanda
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
    - name: schema-reg
      port: 8081
      targetPort: 8081
    - name: proxy
      port: 8082
      targetPort: 8082
  selector:
    app: redpanda
