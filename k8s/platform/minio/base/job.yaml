apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: platform
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-05-09T17-04-24Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO service to respond..."
              until /usr/bin/mc alias set local http://minio.platform.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              echo "Creating Medallion Lakehouse buckets..."
              /usr/bin/mc mb --ignore-existing local/lakehouse-bronze
              /usr/bin/mc mb --ignore-existing local/lakehouse-silver
              /usr/bin/mc mb --ignore-existing local/lakehouse-gold
              /usr/bin/mc mb --ignore-existing local/lakehouse-quarantine
              echo "MinIO buckets initialized successfully!"
