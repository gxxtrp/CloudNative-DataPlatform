apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: platform
data:
  vault.hcl: |
    ui = true
    disable_mlock = true

    listener "tcp" {
      tls_disable = 1
      address     = "0.0.0.0:8200"
    }

    storage "file" {
      path = "/vault/data"
    }

    api_addr = "http://vault.platform.svc.cluster.local:8200"
    cluster_addr = "http://vault.platform.svc.cluster.local:8201"
