apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: platform
  labels:
    app: vault
    tier: platform
    component: security-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        tier: platform
        component: security-secrets
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.16.1
          command:
            - "vault"
            - "server"
            - "-config=/vault/config/vault.hcl"
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - name: http
              containerPort: 8200
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: data
          persistentVolumeClaim:
            claimName: vault-data-pvc
