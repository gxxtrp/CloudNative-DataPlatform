apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: platform
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: cloudnative-dataplatform
    app.kubernetes.io/component: security-secrets
spec:
  size: 1
  image: hashicorp/vault:1.16.1
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:latest

  resources:
    vault:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

  # Auto-unseal: operator stores unseal key + root token in this K8s Secret.
  # Secret is created in-cluster — no values ever touch git.
  # Prereq: k3s etcd encrypted at rest (--encrypt recommended).
  unsealConfig:
    kubernetes:
      secretNamespace: platform
      secretName: vault-unseal-keys

  # Vault HCL config (replaces configmap.yaml + deployment.yaml)
  config:
    storage:
      file:
        path: /vault/file
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    ui: true
    api_addr: "http://vault.platform.svc.cluster.local:8200"
    cluster_addr: "http://vault.platform.svc.cluster.local:8201"

  # Operator manages PVC lifecycle via StatefulSet volumeClaimTemplates.
  # The old standalone pvc.yaml (vault-data-pvc) is superseded and can be git rm'd.
  volumeClaimTemplates:
    - metadata:
        name: vault-file
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-isolated
        resources:
          requests:
            storage: 1Gi

  volumeMounts:
    - name: vault-file
      mountPath: /vault/file

  # Declarative Vault bootstrap (replaces vault-init Job).
  # Only configures structure — no secret values written here.
  # See: docs/security/vault-secrets.md for what to provision in each path.
  externalConfig:
    policies:
      - name: platform-workloads
        rules: |
          path "secret/data/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/*" {
            capabilities = ["list"]
          }

    auth:
      - type: kubernetes
        roles:
          - name: platform-workloads
            bound_service_account_names:
              - default
            bound_service_account_namespaces:
              - platform
              - apps
              - observability
            policies: platform-workloads
            ttl: 1h

    secrets:
      - path: secret
        type: kv
        description: "KV v2 secrets engine — paths defined in docs/security/vault-secrets.md"
        options:
          version: "2"
