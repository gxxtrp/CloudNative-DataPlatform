apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: platform
  labels:
    app.kubernetes.io/name: vault-secretstore
    app.kubernetes.io/part-of: cloudnative-dataplatform
    app.kubernetes.io/component: security-secrets
spec:
  provider:
    vault:
      server: "http://vault.platform.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "platform-workloads"
          serviceAccountRef:
            name: default
